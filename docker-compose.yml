version: "3.9"

services:
  api:
    build: ./python-api-service
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://pos:pos@db:5432/pos
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
      POSTGRES_DB: pos
    ports:
      - "5432:5432"